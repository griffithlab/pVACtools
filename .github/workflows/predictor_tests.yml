name: pVACtools prediction algorithm tests

on:
  push:
    branches: [ master, staging, hotfix ]
  pull_request:
    types: [opened, synchronize, edited, reopened]
    branches:
      - '**'

jobs:
  run_tests:
    name: "Test prediction algorithms used by pVACtools in various Python versions"

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v2
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      - name: Remove unused SDKs to free up space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y ghostscript
          sudo apt-get install -y gcc
          sudo apt-get install -y pandoc
          sudo apt-get install -y mafft
          sudo apt-get install -y build-essential
          sudo apt-get install -y tcsh
          sudo apt-get install -y zlib1g-dev
          sudo apt-get install -y gawk
          sudo apt-get install -y wget
          sudo apt-get install -y unzip
          sudo apt-get clean
          pip install pypandoc==1.7.2
      - name: Install Python dependencies
        run: |
          pip install polars==0.16.18
          pip install pypandoc==1.7.2
          pip install "tensorflow<2.16"
          pip install torch
          pip cache purge
          pip install git+https://github.com/griffithlab/bigmhc.git#egg=bigmhc
          pip install git+https://github.com/griffithlab/deepimmuno.git#egg=deepimmuno
          pip install git+https://github.com/griffithlab/ImmuScope.git#egg=ImmuScope
          pip install -e .
          mhcflurry-downloads fetch
          immuscope-download-weights
      - name: Install IEDB MHC I
        run: |
          mkdir ./IEDB
          cd ./IEDB
          wget https://downloads.iedb.org/tools/mhci/3.1.7/IEDB_MHC_I-3.1.7.tar.gz; tar -xzvf IEDB_MHC_I-3.1.7.tar.gz; rm IEDB_MHC_I-3.1.7.tar.gz
          cd mhc_i
          ./configure
      - name: Install IEDB MHC II
        run: |
          cd ./IEDB
          wget https://downloads.iedb.org/tools/mhcii/3.1.12/IEDB_MHC_II-3.1.12.tar.gz; tar -xzvf IEDB_MHC_II-3.1.12.tar.gz; rm IEDB_MHC_II-3.1.12.tar.gz
          cd mhc_ii
          python ./configure.py -k netmhciipan -k smm -k nn
      - name: Set IEDB_PATH environment variable
        run: echo "IEDB_PATH=./IEDB" >> $GITHUB_ENV
      - name: Install MixMHCpred
        uses: actions/checkout@master
        with:
          repository: GfellerLab/MixMHCpred
          path: ./MixMHCpred
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up MixMHCpred
        run: |
          cd MixMHCpred
          pip install -r code/setup_pythonLibrary.txt
          chmod +x MixMHCpred
          echo "$(pwd -P)" >> $GITHUB_PATH
          cd ..
      - name: Install and set up MixMHC2pred
        run: |
          mkdir ./MixMHC2pred
          cd ./MixMHC2pred
          wget https://github.com/GfellerLab/MixMHC2pred/releases/download/v2.0.2.2/MixMHC2pred-2.0.zip
          unzip MixMHC2pred-2.0.zip
          rm MixMHC2pred-2.0.zip
          chmod +x MixMHC2pred_unix
          echo "$(pwd -P)" >> $GITHUB_PATH
      - name: Install PRIME
        uses: actions/checkout@master
        with:
          repository: GfellerLab/PRIME
          path: ./PRIME
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up PRIME
        run: |
          cd PRIME
          echo "$(pwd -P)" >> $GITHUB_PATH
          cd lib
          g++ -O3 PRIME.cc -o PRIME.x
          cd ../..
      - name: List installed packages
        run: |
          pip list
      - name: Run tests
        env:
          TEST_FLAG: 1
        run: python -m unittest predictor_tests/test_call_predictors.py
